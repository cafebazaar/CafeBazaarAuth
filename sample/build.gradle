apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.farsitel.bazaar.sample.auth'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.farsitel.bazaar.myapplication"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}
kotlin {
    jvmToolchain(17)
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(":auth")
    implementation "androidx.core:core-ktx:$libraryVersions.androidx"
    implementation "androidx.appcompat:appcompat:$libraryVersions.appcompat"
    implementation "androidx.activity:activity-ktx:$libraryVersions.activity"
    implementation "androidx.fragment:fragment-ktx:$libraryVersions.fragment"
    implementation "androidx.constraintlayout:constraintlayout:$libraryVersions.constraintlayout"
    testImplementation "junit:junit:$libraryVersions.junit"
    androidTestImplementation "androidx.test.ext:junit:$libraryVersions.androidxTest"
    androidTestImplementation "androidx.test.espresso:espresso-core:$libraryVersions.espresso"
}
